name: Cloudflare Pages Deployment
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Dependencies
        run: npm ci
      - name: Set up CI environment
        run: cp .env.ci .env
      - name: Build Project
        run: npm run build
      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rmp-apex
      - name: Secret Warning
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "⚠️ CLOUDFLARE_API_TOKEN secret is not configured in GitHub Repository Secrets."
          echo "Please set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings -> Secrets -> Actions to complete live deployment."
